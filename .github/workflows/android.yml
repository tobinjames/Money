name: Android build

# Compiles the app and runs the unit tests on every push, and keeps the debug APK
# as a download on the run's page (Actions > the run > Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not in the repo. The code is first compiled and
      # tested with a placeholder, so a problem with the Firebase file can never hide a
      # problem in the code (or the other way round).
      - name: Placeholder Firebase config
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.moneymanagement" }
              },
              "oauth_client": [{ "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }],
              "api_key": [{ "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder00" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Compile and unit test
        run: ./gradlew --stacktrace compileDebugKotlin testDebugUnitTest

      # Now the real file, from the GOOGLE_SERVICES_JSON repository secret, if there is one
      # (without it the APK is built with the placeholder and can't sign in). The file must
      # be for the Android app registered in Firebase with package name com.moneymanagement.
      - name: Real Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK is built with a placeholder and can't sign in."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          if ! python3 -c "import json,sys; d=json.load(open('app/google-services.json')); sys.exit(0 if any(c['client_info']['android_client_info']['package_name']=='com.moneymanagement' for c in d['client']) else 1)"; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is not for this app. In Firebase > Project settings > Your apps, add an Android app with package name com.moneymanagement, download its google-services.json and save its whole contents as the secret. See docs/BUILD_AND_INSTALL.md."
            exit 1
          fi

      # The signing key is not in the repo either. Google sign-in only works when the APK is
      # signed with a key whose SHA-1 is registered in Firebase, so keep one fixed key in the
      # DEBUG_KEYSTORE_BASE64 secret (store password and key password "android", alias
      # "androiddebugkey"). Without it, a throwaway key is made and sign-in won't work.
      - name: Debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            # Shown so you can compare it with the SHA-1 registered in Firebase.
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA-?1|SHA-?256'
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build the debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Keep the debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: money-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
