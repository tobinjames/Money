name: Android build

# Compiles the app and runs the unit tests on every push, and keeps the debug APK
# as a download on the run's page (Actions > the run > Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not in the repo. Use the one stored as a
      # repository secret (GOOGLE_SERVICES_JSON) if there is one, otherwise a placeholder
      # that is enough to compile (that APK can't sign in).
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.nestwise.app" }
              },
              "oauth_client": [{ "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }],
              "api_key": [{ "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder00" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      # The debug signing key is not in the repo either.
      - name: Debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Compile and unit test
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Keep the debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: money-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
